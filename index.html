<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datagap - Date Difference Calculator</title>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #24272b;
            --text-color: #e1e2e5;
            --accent-color: #4a90e2;
            --border-color: #383c41;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: #a0a4a8;
        }

        input[type="date"] {
            background-color: #2c3035;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input[type="date"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .results {
            margin-top: 30px;
            display: none;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            margin-bottom: 4px;
            padding-left: 15px;
            position: relative;
            color: #c1c4c8;
        }

        .list-item::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #6c727a;
        }

        .header-info {
            margin-bottom: 20px;
        }

        .header-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .blue-diamond {
            color: #4a90e2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Datagap</h1>
        
        <div class="input-group">
            <div class="field">
                <label for="startDate">Start date</label>
                <input type="date" id="startDate">
            </div>
            <div class="field">
                <label for="endDate">End date</label>
                <input type="date" id="endDate">
            </div>
            <button onclick="calculate()">Calculate Difference</button>
        </div>

        <div id="results" class="results">
            <div class="header-info">
                <div class="header-item"><span class="blue-diamond">🔹</span> <strong>From:</strong> <span id="resFrom"></span></div>
                <div class="header-item"><span class="blue-diamond">🔹</span> <strong>To:</strong> <span id="resTo"></span></div>
            </div>

            <div id="sectionsContainer"></div>
            
            <div style="color: #888; font-size: 0.85rem; margin-top: 20px;">
                🔄 To calculate another difference, enter new dates.
            </div>
        </div>
    </div>

    <script>
        function formatDate(date) {
            const d = date.getDate().toString().padStart(2, '0');
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            const y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        function getDifferenceDetails(start, end) {
            let years = end.getFullYear() - start.getFullYear();
            let months = end.getMonth() - start.getMonth();
            let days = end.getDate() - start.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(end.getFullYear(), end.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));

            return { years, months, days, totalDays };
        }

        function calculate() {
            const startVal = document.getElementById('startDate').value;
            const endVal = document.getElementById('endDate').value;

            if (!startVal || !endVal) {
                alert("Please enter both dates.");
                return;
            }

            let start = new Date(startVal);
            let end = new Date(endVal);

            if (start > end) {
                const temp = start;
                start = end;
                end = temp;
            }

            document.getElementById('resFrom').innerText = formatDate(start);
            document.getElementById('resTo').innerText = formatDate(end);

            const totalDiffDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));
            
            const fractions = [
                { label: "Full Difference (1/1)", factor: 1, icon: "📊" },
                { label: "1/2 of the difference", factor: 0.5, icon: "½" },
                { label: "1/3 of the difference", factor: 1/3, icon: "⅓" },
                { label: "1/5 of the difference", factor: 0.2, icon: "⅕" }
            ];

            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';

            fractions.forEach(f => {
                const daysToApply = Math.floor(totalDiffDays * f.factor);
                const fractionEndDate = new Date(start.getTime() + (daysToApply * 24 * 60 * 60 * 1000));
                const diff = getDifferenceDetails(start, fractionEndDate);

                let html = `
                    <div class="section">
                        <div class="section-title">${f.icon} ${f.label}:</div>
                        <ul class="list">
                `;
                
                if (f.factor !== 1) {
                    html += `<li class="list-item">Date: ${formatDate(fractionEndDate)}</li>`;
                }

                html += `
                            <li class="list-item">Years: ${diff.years}</li>
                            <li class="list-item">Months: ${diff.months}</li>
                            <li class="list-item">Days: ${diff.days}</li>
                            <li class="list-item">Total days: ${diff.totalDays}</li>
                        </ul>
                    </div>
                `;
                container.innerHTML += html;
            });

            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
